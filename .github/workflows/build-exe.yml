# Compile SuitPlay (version Windows) en un dossier contenant SuitPlay.exe
# A placer dans .github/workflows/build-exe.yml de votre copie (fork) du projet
name: Build SuitPlay exe

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Installer .NET MAUI
        run: dotnet workload install maui

      - name: Compiler SuitPlay.exe (autonome, sans installation)
        run: >
          dotnet publish SuitPlay/SuitPlay.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o out

      - name: Mettre le resultat a disposition
        uses: actions/upload-artifact@v4
        with:
          name: SuitPlay-Windows
          path: out
