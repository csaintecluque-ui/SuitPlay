# Compare notre moteur aux résultats connus du SuitPlay original et publie le rapport
name: Comparer avec l'original

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "Calculator/**"
      - "Verification/**"
      - ".github/workflows/verification.yml"

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compiler le banc de comparaison
        shell: bash
        run: |
          set -o pipefail
          dotnet build Verification/Verification.csproj -c Release -o bench 2>&1 | tee build.log || {
            grep -E ": error " build.log | sed -E 's/^.*: error /error /' | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          }

      - name: Comparer chaque combinaison (4 min max par combinaison)
        timeout-minutes: 40
        shell: bash
        run: |
          mkdir -p out
          for cfg in false-max false-min true-min; do
            fc=${cfg%-*}; mode=${cfg#*-}
            for f in Calculator/etalons-suitplay/*.json; do
              n=$(basename "$f" .json)
              echo "== $n ($cfg)"
              if timeout 240 dotnet bench/Verification.dll "$f" "$fc" "$mode" > "out/$cfg-$n.txt" 2> "out/$cfg-$n.err"; then
                :
              else
                code=$?
                if [ $code -eq 124 ]; then echo "ROW|| $n | trop long | | | plus de 4 minutes, non comparé |" > "out/$cfg-$n.txt";
                else echo "ROW|| $n | erreur | | | $(head -c 200 out/$cfg-$n.err | tr '\n|' '  ') |" > "out/$cfg-$n.txt"; fi
              fi
            done
          done

      - name: Assembler le rapport
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, datetime
          out = ["# Notre moteur comparé au SuitPlay original", "",
                 f"Généré le {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC. Pourcentages = meilleures chances d'atteindre l'objectif.", "", "## Résumé", ""]
          sections = []
          labels = {"false-max": "fausses cartes non, résultat le plus favorable (comme l'appli aujourd'hui)",
                    "false-min": "fausses cartes non, la défense choisit le déroulement",
                    "true-min": "fausses cartes oui, la défense choisit le déroulement"}
          for fc in ("false-max", "false-min", "true-min"):
              files = sorted(glob.glob(f"out/{fc}-*.txt"))
              rows, mps, matches, gaps, mp_same, done = [], [], 0, 0.0, 0, 0
              for f in files:
                  for line in open(f, encoding="utf-8"):
                      line = line.rstrip("\n")
                      if line.startswith("ROW|"): rows.append(line[4:])
                      elif line.startswith("MP|"): mps.append(line[3:])
                      elif line.startswith("STAT|"):
                          _, m, g, s = line.split("|"); matches += int(m); gaps += float(g); mp_same += int(s); done += 1
              label = labels[fc]
              out.append(f"- {label} : {done}/{len(files)} combinaisons comparées, {matches} objectifs identiques, écart cumulé {gaps*100:.1f} points, meilleure ligne en matchpoints identique {mp_same}/{done}")
              sec = ["", f"## {label}", "", "| Combinaison | Objectif | Original | Nous | Écart |", "|---|---|---|---|---|"] + rows
              sec += ["", "### Meilleure ligne en matchpoints", "", "| Combinaison | Original | Nous | Identique |", "|---|---|---|---|"] + mps
              sections += sec
          open("rapport.md", "w", encoding="utf-8").write("\n".join(out + sections) + "\n")
          PY
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport sur la branche rapports
        if: always()
        shell: bash
        run: |
          mkdir publish && cp rapport.md publish/
          cd publish
          git init -q
          git checkout -q -b rapports
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Rapport de comparaison"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rapports
